name: Build and syntax checks

on:
  push:
    branches: [main, work/design-studio-upgrade, security/hardening-audit]
  pull_request:
    branches: [main, work/design-studio-upgrade]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            storefront/package-lock.json
            admin/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Report backend dependency advisories
        run: |
          npm audit --prefix backend --json > /tmp/backend-audit.json || true
          node -e 'const a=require("/tmp/backend-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + v.severity + ", fix=" + JSON.stringify(v.fixAvailable) + ", advisories=" + JSON.stringify(v.via)); console.log("Counts:", JSON.stringify(a.metadata?.vulnerabilities || {}));'

      - name: Fail on moderate or higher backend advisories
        run: npm audit --prefix backend --audit-level=moderate

      - name: Check backend test syntax
        run: find backend/tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Verify local write protection
        run: |
          NODE_ENV=development PORT=4060 node backend/src/index.js > /tmp/go-iphone-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4060/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat /tmp/go-iphone-api.log; exit 1; fi
          API_URL=http://127.0.0.1:4060 node backend/tests/local-write-guard.e2e.mjs

      - name: Install storefront dependencies
        run: npm ci --prefix storefront

      - name: Report storefront dependency advisories
        run: |
          npm audit --prefix storefront --json > /tmp/storefront-audit.json || true
          node -e 'const a=require("/tmp/storefront-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + v.severity + ", fix=" + JSON.stringify(v.fixAvailable) + ", advisories=" + JSON.stringify(v.via)); console.log("Counts:", JSON.stringify(a.metadata?.vulnerabilities || {}));'

      - name: Fail on moderate or higher storefront advisories
        run: npm audit --prefix storefront --audit-level=moderate

      - name: Build storefront
        run: npm run build --prefix storefront

      - name: Install admin dependencies
        run: npm ci --prefix admin

      - name: Report admin dependency advisories
        run: |
          npm audit --prefix admin --json > /tmp/admin-audit.json || true
          node -e 'const a=require("/tmp/admin-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + v.severity + ", fix=" + JSON.stringify(v.fixAvailable) + ", advisories=" + JSON.stringify(v.via)); console.log("Counts:", JSON.stringify(a.metadata?.vulnerabilities || {}));'

      - name: Fail on moderate or higher admin advisories
        run: npm audit --prefix admin --audit-level=moderate

      - name: Build admin
        run: npm run build --prefix admin


