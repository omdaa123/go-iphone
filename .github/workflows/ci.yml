name: Build and syntax checks

on:
  push:
    branches: [main, work/design-studio-upgrade]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            storefront/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Report backend dependency advisories
        run: |
          npm audit --prefix backend --json > /tmp/backend-audit.json || true
          node -e 'const a=require("/tmp/backend-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + v.severity + ", fix=" + JSON.stringify(v.fixAvailable)); console.log("Counts:", JSON.stringify(a.metadata?.vulnerabilities || {}));'

      - name: Check backend test syntax
        run: find backend/tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Install storefront dependencies
        run: npm ci --prefix storefront

      - name: Build storefront
        run: npm run build --prefix storefront

      - name: Install admin dependencies
        run: npm install --prefix admin --no-package-lock --no-audit --no-fund

      - name: Build admin
        run: npm run build --prefix admin
